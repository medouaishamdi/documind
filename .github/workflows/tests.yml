name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: documind-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: documind-api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run eval   # BM25 benchmark, runs offline
